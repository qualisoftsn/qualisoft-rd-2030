# PROJET : Qualisoft Elite RD 2030 - PRODUCTION OVH
# STRATÉGIE : Performance & Étanchéité (SSL-Ready)

services:
  # 🗄️ PERSISTANCE DES DONNÉES
  db:
    image: postgres:16-alpine
    container_name: qualisoft_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    # Suppression du port 5544 pour la prod (sécurité : accessible uniquement en interne via le network)
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualisoft_network

  # 🧠 NOYAU API (NestJS)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualisoft-backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G # Augmenté pour la charge de prod
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - NODE_ENV=production
      - PORT=9000
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://app.qualisoft.sn # Ton futur domaine
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qualisoft_network

  # 💻 COCKPIT (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qualisoft-frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.qualisoft.sn/api # URL Publique SSL
      - INTERNAL_API_URL=http://backend:9000/api
      - NEXTAUTH_URL=https://app.qualisoft.sn
      - NEXTAUTH_SECRET=${JWT_SECRET}
    depends_on:
      - backend
    networks:
      - qualisoft_network

networks:
  qualisoft_network:
    driver: bridge

volumes:
  postgres_data_prod: