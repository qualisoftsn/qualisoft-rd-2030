services:
  # --- 1. BASE DE DONNÉES ---
  db:
    image: postgres:16-alpine
    container_name: qualisoft_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qualipass2026
      - POSTGRES_DB=qualisoft_db
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qualisoft_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualisoft_network

  # --- 2. CACHE ---
  redis:
    image: redis:7-alpine
    container_name: qualisoft_redis
    restart: "no"
    ports:
      - "6379:6379"
    networks:
      - qualisoft_network

  # --- 3. BACKEND ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualisoft-backend
    restart: unless-stopped # Changé pour la stabilité
    environment:
      - DATABASE_URL=postgresql://postgres:qualipass2026@db:5432/qualisoft_db?schema=public
      - NODE_ENV=production # Passé en production
      - PORT=9000
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    networks:
      - qualisoft_network

  # --- 4. FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 🔥 CRUCIAL : On injecte l'URL publique pendant le BUILD
        - NEXT_PUBLIC_API_URL=https://elite.qualisoft.sn/api
    container_name: qualisoft-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # On le remet ici aussi par sécurité pour le runtime
      - NEXT_PUBLIC_API_URL=https://elite.qualisoft.sn/api
    depends_on:
      - backend
    networks:
      - qualisoft_network

networks:
  qualisoft_network:
    driver: bridge

volumes:
  postgres_data: