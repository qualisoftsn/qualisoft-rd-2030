# ==============================================================================
# 🛰️ QUALISOFT ELITE RD 2030 - ARCHITECTURE MULTI-TENANT (SOUVERAINE)
# STRATÉGIE : Accès par sous-domaines dynamiques (*.qualisoft.sn)
# ==============================================================================

services:
  # 🗄️ DATABASE
  qualisoft-db:
    image: postgres:16-alpine
    container_name: qualisoft-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qualipass2026}
      POSTGRES_DB: ${DB_NAME:-qualisoft_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualisoft_elite_net

  # 🧠 BACKEND : Matrix Engine (NestJS)
  qualisoft-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualisoft-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-qualipass2026}@qualisoft-db:5432/${DB_NAME:-qualisoft_db}?schema=public
      NODE_ENV: production
      PORT: 9000
      JWT_SECRET: ${JWT_SECRET}
      # 🚩 CORS MULTI-TENANT : Autorise la Vitrine ET tous les sous-domaines Elite
      # Note : En NestJS, il faudra s'assurer que l'origin check accepte les regex ou .qualisoft.sn
      FRONTEND_URL: https://qualisoft.sn,https://app.qualisoft.sn
      ALLOWED_DOMAINS: .qualisoft.sn
    ports:
      - "9000:9000"
    depends_on:
      qualisoft-db:
        condition: service_healthy
    networks:
      - qualisoft_elite_net

  # 💻 FRONTEND : Cockpit Elite (Next.js 15)
  qualisoft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qualisoft-frontend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      # ✅ L'API doit être centrale pour tous les sous-domaines
      NEXT_PUBLIC_API_URL: https://api.qualisoft.sn/api
    ports:
      - "3001:3001"
    depends_on:
      - qualisoft-backend
    networks:
      - qualisoft_elite_net

networks:
  qualisoft_elite_net:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local