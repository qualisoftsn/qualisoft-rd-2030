# ==============================================================================
# 🛰️ QUALISOFT ELITE RD 2030 - ARCHITECTURE MULTI-TENANT (PRODUCTION)
# STRATÉGIE : Isolation réseau et Proxy sécurisé Nginx
# ==============================================================================

services:
  # 🗄️ DATABASE : Le Coeur de Données
  qualisoft-db:
    image: postgres:16-alpine
    container_name: qualisoft-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qualipass2026}
      POSTGRES_DB: ${DB_NAME:-qualisoft_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      # Utilisation de la syntaxe robuste pour pg_isready
      test: ["CMD-SHELL", "pg_isready -U postgres -d qualisoft_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualisoft_elite_net

  # 🧠 BACKEND : Matrix Engine (NestJS)
  qualisoft-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualisoft-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:qualipass2026@qualisoft-db:5432/qualisoft_db?schema=public
      NODE_ENV: production
      PORT: 9000
      JWT_SECRET: ${JWT_SECRET}
      # Autorisation des frontends souverains
      FRONTEND_URL: "https://qualisoft.sn,https://app.qualisoft.sn,https://qs.qualisoft.sn,https://pad.qualisoft.sn,https://sagam.qualisoft.sn"
      ALLOWED_DOMAINS: ".qualisoft.sn"
    ports:
      # Seul Nginx sur le serveur peut parler au Backend
      - "127.0.0.1:9005:9000"
    depends_on:
      qualisoft-db:
        condition: service_healthy
    networks:
      - qualisoft_elite_net

  # 💻 FRONTEND : Cockpit Elite (Next.js 15 Standalone)
  qualisoft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qualisoft-frontend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      # Communication Browser -> API
      NEXT_PUBLIC_API_URL: "https://api.qualisoft.sn/api"
      # Communication Server (SSR) -> API (Interne Docker)
      API_URL_INTERNAL: "http://qualisoft-backend:9000/api"
    ports:
      # Seul Nginx sur le serveur peut parler au Frontend
      - "127.0.0.1:3005:3001"
    depends_on:
      qualisoft-backend:
        condition: service_started
    networks:
      - qualisoft_elite_net

networks:
  qualisoft_elite_net:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local