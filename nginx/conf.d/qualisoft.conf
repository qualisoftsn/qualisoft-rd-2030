/**
 * CHEMIN ABSOLU : /nginx/conf.d/qualisoft.conf
 * PROJET : Qualisoft RD 2030 (Elite MS)
 * RÔLE : Reverse Proxy, Gestion des Wildcards & SSL
 */

# 🔀 UPSTREAMS
upstream backend_node {
    server qualisoft-backend:9000;
}

upstream frontend_node {
    server qualisoft-frontend:3000;
}

# 🔐 REDIRECTION HTTP -> HTTPS
server {
    listen 80;
    server_name qualisoft.sn *.qualisoft.sn;
    return 301 https://$host$request_uri;
}

# 🏗️ CONFIGURATION API (api.qualisoft.sn)
server {
    listen 443 ssl;
    server_name api.qualisoft.sn;

    # Certificats OVH / Let's Encrypt
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://backend_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 🏢 CONFIGURATION APP & WILDCARDS (qualisoft.sn, *.qualisoft.sn)
server {
    listen 443 ssl;
    server_name qualisoft.sn *.qualisoft.sn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://frontend_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 🛡️ CRITIQUE : Transmet le sous-domaine au Proxy Next.js
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optimisation des fichiers statiques Next.js
    location /_next/static {
        proxy_pass http://frontend_node;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600";
    }
}