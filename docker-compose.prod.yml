# CHEMIN ABSOLU : /docker-compose.prod.yml
# PROJET : Qualisoft RD 2030 (Elite MS)
# RÔLE : Orchestration de Production avec accès PC-DEV (Mapping 3001/9000)

services:
  # 🗄️ BASE DE DONNÉES : Le Cœur de la Matrix
  qualisoft-db:
    image: postgres:16-alpine
    container_name: qualisoft-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - qualisoft_db_data:/var/lib/postgresql/data
    networks:
      - qualisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚡ CACHE : Accélérateur de Sessions & Matrix
  qualisoft-redis:
    image: redis:7-alpine
    container_name: qualisoft-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - qualisoft_redis_data:/data
    networks:
      - qualisoft-network

  # ⚙️ BACKEND : Moteur NestJS (Accès 9000)
  qualisoft-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: qualisoft-backend
    restart: always
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@qualisoft-db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://qualisoft-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      qualisoft-db:
        condition: service_healthy
      qualisoft-redis:
        condition: service_started
    networks:
      - qualisoft-network

  # 🖥️ FRONTEND : Cockpit Next.js (Accès 3001)
  qualisoft-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: qualisoft-frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:9000/api
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@qualisoft-db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - qualisoft-backend
    networks:
      - qualisoft-network

  # 🛰️ PROXY : Nginx Reverse Proxy
  qualisoft-nginx:
    image: nginx:stable-alpine
    container_name: qualisoft-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - qualisoft-frontend
      - qualisoft-backend
    networks:
      - qualisoft-network

networks:
  qualisoft-network:
    driver: bridge

volumes:
  qualisoft_db_data:
    driver: local
  qualisoft_redis_data:
    driver: local